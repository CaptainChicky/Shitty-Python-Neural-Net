<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Digit Classifier</title>
    <style>
        @font-face {
            font-family: 'JetBrains Mono';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('./fonts/JetBrainsMono-Regular.woff2') format('woff2');
        }

        @font-face {
            font-family: 'JetBrains Mono';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('./fonts/JetBrainsMono-Bold.woff2') format('woff2');
        }

        @font-face {
            font-family: 'Space Mono';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('./fonts/SpaceMono-Regular.woff2') format('woff2');
        }

        @font-face {
            font-family: 'Space Mono';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('./fonts/SpaceMono-Bold.woff2') format('woff2');
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e27;
            --bg-card: #151b38;
            --accent: #00ff88;
            --accent-dim: #00cc6a;
            --text: #e4e4e7;
            --text-dim: #a1a1aa;
            --border: #2d3548;
            --canvas-bg: #000000;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 136, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 180, 255, 0.05) 0%, transparent 50%);
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent) 0%, #00b4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-dim);
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            max-width: 1400px;
            width: 100%;
            animation: fadeIn 1s ease;
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .panel-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .canvas-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border: 2px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: var(--canvas-bg);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button {
            font-family: 'Space Mono', monospace;
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-dark);
            color: var(--text);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        button:hover {
            background: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.active {
            background: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
        }

        .preview {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--bg-dark);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .preview-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .preview-canvas {
            width: 56px;
            height: 56px;
            border: 1px solid var(--border);
            border-radius: 4px;
            image-rendering: pixelated;
            background: var(--canvas-bg);
        }

        .predictions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .prediction-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: slideInRight 0.5s ease;
            animation-fill-mode: both;
        }

        .prediction-item:nth-child(1) { animation-delay: 0.05s; }
        .prediction-item:nth-child(2) { animation-delay: 0.1s; }
        .prediction-item:nth-child(3) { animation-delay: 0.15s; }
        .prediction-item:nth-child(4) { animation-delay: 0.2s; }
        .prediction-item:nth-child(5) { animation-delay: 0.25s; }
        .prediction-item:nth-child(6) { animation-delay: 0.3s; }
        .prediction-item:nth-child(7) { animation-delay: 0.35s; }
        .prediction-item:nth-child(8) { animation-delay: 0.4s; }
        .prediction-item:nth-child(9) { animation-delay: 0.45s; }
        .prediction-item:nth-child(10) { animation-delay: 0.5s; }

        .digit-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            width: 40px;
            text-align: center;
            color: var(--accent);
        }

        .bar-container {
            flex: 1;
            background: var(--bg-dark);
            border-radius: 8px;
            height: 32px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent) 0%, var(--accent-dim) 100%);
            border-radius: 8px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.3) 50%, 
                transparent 100%);
            animation: shimmer 2s infinite;
        }

        .percentage {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            width: 60px;
            text-align: right;
            color: var(--text);
        }

        .status {
            padding: 1rem;
            background: var(--bg-dark);
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-dim);
            border: 1px solid var(--border);
        }

        .status.ready {
            color: var(--accent);
            border-color: var(--accent);
        }

        .status.error {
            color: #ff4757;
            border-color: #ff4757;
        }

        .file-upload {
            padding: 1rem;
            background: var(--bg-dark);
            border: 2px dashed var(--border);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload:hover {
            border-color: var(--accent);
            background: rgba(0, 255, 136, 0.05);
        }

        .file-upload input {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>MNIST Classifier</h1>
        <p>Draw a digit and watch the neural network predict</p>
    </div>

    <div class="container">
        <div class="panel">
            <div class="panel-title">Drawing Canvas</div>
            <div class="canvas-container">
                <div class="canvas-wrapper">
                    <canvas id="drawCanvas" width="280" height="280"></canvas>
                </div>
                
                <div class="controls">
                    <button id="clearBtn">Clear</button>
                    <button id="drawBtn" class="active">Draw</button>
                    <button id="eraseBtn">Erase</button>
                </div>

                <div class="preview">
                    <span class="preview-label">28×28 Preview:</span>
                    <canvas id="previewCanvas" class="preview-canvas" width="28" height="28"></canvas>
                </div>

                <div class="file-upload" id="fileUpload">
                    <input type="file" id="modelFile" accept=".json">
                    <label for="modelFile">📁 Upload model_mnist.json</label>
                </div>

                <div id="status" class="status">Waiting for model...</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">Predictions</div>
            <div class="predictions">
                <div class="prediction-item">
                    <div class="digit-label">0</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="bar-0" style="width: 0%"></div>
                    </div>
                    <div class="percentage" id="pct-0">0.0%</div>
                </div>
                <div class="prediction-item">
                    <div class="digit-label">1</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="bar-1" style="width: 0%"></div>
                    </div>
                    <div class="percentage" id="pct-1">0.0%</div>
                </div>
                <div class="prediction-item">
                    <div class="digit-label">2</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="bar-2" style="width: 0%"></div>
                    </div>
                    <div class="percentage" id="pct-2">0.0%</div>
                </div>
                <div class="prediction-item">
                    <div class="digit-label">3</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="bar-3" style="width: 0%"></div>
                    </div>
                    <div class="percentage" id="pct-3">0.0%</div>
                </div>
                <div class="prediction-item">
                    <div class="digit-label">4</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="bar-4" style="width: 0%"></div>
                    </div>
                    <div class="percentage" id="pct-4">0.0%</div>
                </div>
                <div class="prediction-item">
                    <div class="digit-label">5</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="bar-5" style="width: 0%"></div>
                    </div>
                    <div class="percentage" id="pct-5">0.0%</div>
                </div>
                <div class="prediction-item">
                    <div class="digit-label">6</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="bar-6" style="width: 0%"></div>
                    </div>
                    <div class="percentage" id="pct-6">0.0%</div>
                </div>
                <div class="prediction-item">
                    <div class="digit-label">7</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="bar-7" style="width: 0%"></div>
                    </div>
                    <div class="percentage" id="pct-7">0.0%</div>
                </div>
                <div class="prediction-item">
                    <div class="digit-label">8</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="bar-8" style="width: 0%"></div>
                    </div>
                    <div class="percentage" id="pct-8">0.0%</div>
                </div>
                <div class="prediction-item">
                    <div class="digit-label">9</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="bar-9" style="width: 0%"></div>
                    </div>
                    <div class="percentage" id="pct-9">0.0%</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d');
        
        let isDrawing = false;
        let isErasing = false;
        let model = null;

        // Initialize canvas
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Drawing functions
        function startDrawing(e) {
            isDrawing = true;
            draw(e);
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
            if (model) {
                predict();
            }
        }

        function draw(e) {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            ctx.lineWidth = isErasing ? 30 : 20;
            ctx.strokeStyle = isErasing ? '#000000' : '#ffffff';
            
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // Event listeners
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Touch events
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const mouseEvent = new MouseEvent('mouseup', {});
            canvas.dispatchEvent(mouseEvent);
        });

        // Button controls
        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            resetPredictions();
        });

        document.getElementById('drawBtn').addEventListener('click', () => {
            isErasing = false;
            document.getElementById('drawBtn').classList.add('active');
            document.getElementById('eraseBtn').classList.remove('active');
        });

        document.getElementById('eraseBtn').addEventListener('click', () => {
            isErasing = true;
            document.getElementById('eraseBtn').classList.add('active');
            document.getElementById('drawBtn').classList.remove('active');
        });

        // Model loading
        document.getElementById('modelFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        model = JSON.parse(event.target.result);
                        
                        // Validate model structure
                        const layerKeys = Object.keys(model).filter(key => key.startsWith('Layer_'));
                        if (layerKeys.length === 0) {
                            throw new Error('No layers found in model');
                        }
                        
                        // Get output layer info
                        const outputLayer = model[layerKeys[layerKeys.length - 1]];
                        const outputSize = outputLayer.layer_size;
                        
                        document.getElementById('status').textContent = 
                            `✅ Model loaded! ${layerKeys.length} layers, output size: ${outputSize}`;
                        document.getElementById('status').className = 'status ready';
                    } catch (error) {
                        document.getElementById('status').textContent = `❌ Error: ${error.message}`;
                        document.getElementById('status').className = 'status error';
                        model = null;
                    }
                };
                reader.readAsText(file);
            }
        });

        // Neural network activation functions
        function sigmoid(x) {
            return 1 / (1 + Math.exp(-x));
        }

        function relu(x) {
            return Math.max(0, x);
        }

        function leaky_relu(x, alpha = 0.01) {
            return x > 0 ? x : alpha * x;
        }

        function tanh(x) {
            return Math.tanh(x);
        }

        function softmax(arr) {
            const max = Math.max(...arr);
            const exps = arr.map(x => Math.exp(x - max));
            const sum = exps.reduce((a, b) => a + b, 0);
            return exps.map(x => x / sum);
        }

        function applyActivation(values, activationFunc, params = {}) {
            switch(activationFunc) {
                case 'sigmoid':
                    return values.map(x => sigmoid(x));
                case 'relu':
                    return values.map(x => relu(x));
                case 'leaky_relu':
                    const alpha = params.alpha || 0.01;
                    return values.map(x => leaky_relu(x, alpha));
                case 'tanh':
                    return values.map(x => tanh(x));
                case 'softmax':
                    return softmax(values);
                default:
                    return values;
            }
        }

        function forwardPass(input) {
            if (!model) return null;

            let activations = input;

            // Get all layer keys and sort them
            const layerKeys = Object.keys(model).filter(key => key.startsWith('Layer_')).sort();

            // Process each layer (skip Layer_0 which is input layer)
            for (let i = 1; i < layerKeys.length; i++) {
                const layer = model[layerKeys[i]];
                const weights = layer.weights;
                const biases = layer.biases;
                const activationFunc = layer.activation_func;
                const activationParams = layer.activation_params || {};

                // Matrix multiplication: activations @ weights + biases
                const newActivations = [];
                for (let j = 0; j < weights.length; j++) {
                    let sum = biases[j];
                    for (let k = 0; k < activations.length; k++) {
                        sum += activations[k] * weights[j][k];
                    }
                    newActivations.push(sum);
                }

                // Apply activation function
                activations = applyActivation(newActivations, activationFunc, activationParams);
            }

            return activations;
        }

        function getCanvasData() {
            // Get image data from main canvas
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            // Downsample to 28x28
            const downsampledData = new Array(28 * 28).fill(0);
            const scale = canvas.width / 28;

            for (let y = 0; y < 28; y++) {
                for (let x = 0; x < 28; x++) {
                    let sum = 0;
                    let count = 0;

                    // Average the pixels in this block
                    for (let dy = 0; dy < scale; dy++) {
                        for (let dx = 0; dx < scale; dx++) {
                            const srcX = Math.floor(x * scale + dx);
                            const srcY = Math.floor(y * scale + dy);
                            const idx = (srcY * canvas.width + srcX) * 4;
                            
                            // Use red channel (they're all the same for grayscale)
                            sum += imageData.data[idx];
                            count++;
                        }
                    }

                    // Normalize to [0, 1]
                    downsampledData[y * 28 + x] = (sum / count) / 255.0;
                }
            }

            // Update preview canvas
            const previewImageData = previewCtx.createImageData(28, 28);
            for (let i = 0; i < 28 * 28; i++) {
                const value = Math.floor(downsampledData[i] * 255);
                previewImageData.data[i * 4] = value;     // R
                previewImageData.data[i * 4 + 1] = value; // G
                previewImageData.data[i * 4 + 2] = value; // B
                previewImageData.data[i * 4 + 3] = 255;   // A
            }
            previewCtx.putImageData(previewImageData, 0, 0);

            return downsampledData;
        }

        function predict() {
            if (!model) return;

            const inputData = getCanvasData();
            const predictions = forwardPass(inputData);

            if (predictions) {
                updatePredictions(predictions);
            }
        }

        function updatePredictions(predictions) {
            // Handle both single output and multi-output
            if (predictions.length === 1) {
                // Binary classification - not typical for MNIST but handle it
                document.getElementById('status').textContent = 
                    `⚠️ Model has 1 output (expected 10 for MNIST)`;
                return;
            }
            
            if (predictions.length !== 10) {
                document.getElementById('status').textContent = 
                    `⚠️ Model has ${predictions.length} outputs (expected 10 for MNIST)`;
            }
            
            // Update display for available predictions
            const numPredictions = Math.min(10, predictions.length);
            for (let i = 0; i < numPredictions; i++) {
                const percentage = (predictions[i] * 100).toFixed(1);
                document.getElementById(`bar-${i}`).style.width = `${predictions[i] * 100}%`;
                document.getElementById(`pct-${i}`).textContent = `${percentage}%`;
            }
            
            // Reset remaining if model has fewer than 10 outputs
            for (let i = predictions.length; i < 10; i++) {
                document.getElementById(`bar-${i}`).style.width = '0%';
                document.getElementById(`pct-${i}`).textContent = '0.0%';
            }
        }

        function resetPredictions() {
            for (let i = 0; i < 10; i++) {
                document.getElementById(`bar-${i}`).style.width = '0%';
                document.getElementById(`pct-${i}`).textContent = '0.0%';
            }
            previewCtx.fillStyle = '#000000';
            previewCtx.fillRect(0, 0, 28, 28);
        }

        // Initialize
        resetPredictions();
    </script>
</body>
</html>
